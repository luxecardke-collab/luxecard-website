<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <!-- iOS/iPadOS home-screen icon: mobile browsers don't use the plain
         favicon above, so without this the address bar/home screen falls
         back to a generic globe. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#08080A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page title, description, canonical and Open Graph/Twitter tags
         (src/seo/pages.ts). Filled in for each page by scripts/prerender.mjs
         at build time, and with the homepage's tags by the dev server. -->
    <!--app-head-->
    <!-- Set before any CSS has a chance to load, so there is never a flash
         of a default white/empty background while index.css is fetched
         and parsed. Same colour as --bg-base in index.css. -->
    <style>
      html, body { background: #08080a; }
    </style>
    <!-- Start the nav logo downloading with the HTML rather than after the JS
         bundle renders the nav, so it is ready when the nav fades in. -->
    <link rel="preload" as="image" href="/images/luxecard-logo.webp" fetchpriority="high" />
    <!-- Only the fonts the first screen uses: the hero heading (Manrope
         800), its body text (Inter 400, the default weight) and section
         headings (Manrope 700; on the card pages the reviews heading is on
         screen at load) — every other weight waits for the normal CSS
         discovery. These paths are the exact same
         URLs the @font-face rules in index.css resolve to (see there), so
         the browser doesn't fetch the font twice. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/manrope-800.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/manrope-700.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
